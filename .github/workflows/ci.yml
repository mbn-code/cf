name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck coreutils

      - name: shellcheck
        run: shellcheck -s bash scripts/cf scripts/check.sh scripts/test.sh scripts/validate.sh tests/cli_test.sh

      - name: Toolchain
        run: |
          which g++ clang++ || true
          (g++ --version || clang++ --version) | head -1

      - name: CLI test suite
        run: bash tests/cli_test.sh

      - name: Makefile smoke test
        run: |
          make all
          make test FILE=watermelon

  web:
    name: Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Version consistency
        working-directory: .
        run: |
          cli=$(sed -n 's/^CF_VERSION="\(.*\)"$/\1/p' scripts/cf)
          pkg=$(node -p "require('./web/package.json').version")
          test "$cli" = "$pkg" || { echo "scripts/cf=$cli web/package.json=$pkg"; exit 1; }

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test
        env:
          CI: "1"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
